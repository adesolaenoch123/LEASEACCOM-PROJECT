<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Listing review | LeaseAccom</title>
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
  <style>
    body { background:#f4f7f5; margin:0; font-family:system-ui,sans-serif; }
    .adm { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
    .adm h1 { margin: 0 0 6px; font-size: 24px; }
    .adm-sub { color:#5f6b64; margin: 0 0 18px; font-size: 14px; }
    .adm-nav { margin-bottom: 14px; font-size: 14px; }
    .adm-nav a { color:#15945c; font-weight:700; text-decoration:none; margin-right: 12px; }
    .adm-card { background:#fff; border:1px solid #e0e8e3; border-radius:14px; padding:14px; margin-bottom:12px; display:grid; grid-template-columns: 96px 1fr; gap:14px; }
    .adm-card img { width:96px; height:72px; object-fit:cover; border-radius:10px; background:#eef3f0; }
    .adm-card h3 { margin:0 0 4px; font-size:15px; }
    .adm-meta { font-size:12px; color:#5f6b64; line-height:1.45; }
    .adm-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .adm-actions button { border:0; border-radius:10px; padding:9px 12px; font-weight:700; cursor:pointer; }
    .adm-approve { background:#15945c; color:#fff; }
    .adm-reject { background:#fde8e8; color:#a33; }
    .badge { display:inline-block; font-size:10px; font-weight:800; padding:3px 8px; border-radius:999px; background:#fff4d6; color:#8a6a00; text-transform:uppercase; }
    .badge.live { background:#e9f7ef; color:#0d7547; }
    .adm-empty { text-align:center; padding:28px; color:#6b746e; }
    @media(max-width:560px){ .adm-card{ grid-template-columns:1fr; } .adm-card img{ width:100%; height:140px; } }
  </style>
</head>
<body>
  <div class="adm">
    <div class="adm-nav">
      <a href="admin-owner-verification.html">Owner verification</a>
      <a href="owner-dashboard.html">Owner dashboard</a>
      <a href="properties.html">Marketplace</a>
    </div>
    <h1>Listing review queue</h1>
    <p class="adm-sub">Approve quality listings to set them <strong>Live</strong>. Pending listings stay off the public marketplace.</p>
    <div id="admListingQueue"></div>
  </div>
  <script src="JS/admin-listings.js"></script>
</body>
</html>
