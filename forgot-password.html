<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password — LeaseAccom</title>
  <meta name="description" content="Reset your LeaseAccom password via email.">
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
  <style>
    .auth-extra { margin-top: 12px; font-size: 14px; }
    .auth-extra a { color: #0d7547; font-weight: 700; }
    .form-status.is-visible { display: block; margin-top: 12px; font-weight: 600; }
    .form-status.is-success { color: #0d7547; }
    .form-status.is-error { color: #c0392b; }
  </style>
</head>
<body>
<header class="navbar">
  <a href="index.html" class="logo">
    <img src="IMAGES/leaseaccom-logo-full.png" alt="LeaseAccom">
  </a>
</header>
<main class="auth-page">
  <div class="auth-container">
    <div class="auth-heading">
      <span class="section-label">ACCOUNT RECOVERY</span>
      <h1>Forgot your password?</h1>
      <p>Enter the email you used to sign up. We’ll send a secure link to set a new password.</p>
    </div>
    <form id="forgotForm" class="auth-form">
      <label>
        Email address
        <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email">
      </label>
      <button type="submit" class="primary-btn auth-submit">Send recovery email</button>
    </form>
    <p class="auth-extra" style="margin-top:16px;">
      <a href="login.html">← Back to login</a> · 
      <a href="register.html">Create account</a>
    </p>
    <p style="margin-top:20px;font-size:13px;color:#666;">
      Tip: Check your spam folder if the reset email doesn’t arrive within a few minutes.
    </p>
    <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>
    <div class="auth-footer auth-extra">
      <a href="login.html">Back to log in</a>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase-client.js"></script>
<script>
(function () {
  var form = document.getElementById("forgotForm");
  var status = document.getElementById("authStatus");
  function show(msg, type) {
    status.textContent = msg;
    status.className = "form-status is-visible is-" + (type || "error");
  }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = document.getElementById("forgotEmail").value.trim();
    if (!email) return show("Enter your email.");
    show("Sending recovery email…", "success");
    try {
      if (!window.LeaseAccomAuth || !window.LeaseAccomAuth.resetPasswordForEmail) {
        return show("Auth is not available. Check Supabase connection.");
      }
      var result = await window.LeaseAccomAuth.resetPasswordForEmail(email);
      if (result && result.error) {
        var m = result.error.message || "Could not send email";
        if (/rate limit/i.test(m)) {
          m = "Too many requests. Wait about an hour, or set a new password in Supabase Authentication → Users.";
        }
        return show(m);
      }
      show("If an account exists for that email, a recovery link is on its way. Check inbox and spam.", "success");
    } catch (err) {
      show(err.message || "Request failed");
    }
  });
})();
</script>
</body>
</html>
