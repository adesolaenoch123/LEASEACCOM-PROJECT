<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Owner verification | LeaseAccom</title>
  <link rel="stylesheet" href="CSS/verification.css">
  <link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
</head>
<body style="background:#f4f7f5;margin:0;font-family:system-ui,sans-serif">
  <div class="ov-adm">
    <div style="margin-bottom:14px;font-size:13px">
      <a href="admin/admin.html" style="color:#0d7547;font-weight:700;text-decoration:none">← Command Centre</a>
      ·
      <a href="owner-verification.html" style="color:#0d7547;font-weight:700;text-decoration:none">Owner form</a>
    </div>
    <h1>Landlord verification queue</h1>
    <p class="ov-adm-sub">Review identity and ownership documents. Approve only when documents look genuine and match the applicant.</p>

    <div class="ov-adm-filters">
      <button type="button" data-filter="pending" class="is-active">Pending</button>
      <button type="button" data-filter="verified">Verified</button>
      <button type="button" data-filter="rejected">Rejected</button>
      <button type="button" data-filter="all">All</button>
    </div>

    <div id="ovAdmStats" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;font-weight:700"></div>
    <div id="admOwnerQueue"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase-client.js"></script>
<script src="JS/leaseaccom-live-mode.js"></script>
<script src="JS/leaseaccom-cloud.js"></script>
<script src="JS/admin-owner-verification.js"></script>
<script src="JS/admin-cloud-properties.js"></script>
</body>
</html>
