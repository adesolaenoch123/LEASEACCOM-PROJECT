<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — LeaseAccom</title>
<meta name="description" content="Log in to LeaseAccom to manage your property search, applications and messages.">

    <link rel="stylesheet" href="CSS/style.css">

<link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
</head>


<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <picture>
  <source media="(max-width: 820px)" srcset="IMAGES/leaseaccom-logo-icon.png">
  <img src="IMAGES/leaseaccom-logo-full.png" alt="LeaseAccom" style="height:48px;width:auto;object-fit:contain;">
</picture>
    </a>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-heading">

            <span class="section-label">
                WELCOME BACK
            </span>

            <h1>
                Log in to LeaseAccom.
            </h1>

            <p>
                Access your properties, applications,
                viewings and messages.
            </p>

        </div>


        <form id="loginForm" class="auth-form">

            <label>

                Email address

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    required
                >

            </label>


            <button
                type="submit"
                class="primary-btn auth-submit"
            >
                Log In
            </button>

        </form>

        <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>

        <p class="auth-extra" style="margin-top:10px;text-align:right;font-size:14px">
            <a href="forgot-password.html" style="color:#0d7547;font-weight:700">Forgot password?</a>
        </p>

        <div class="auth-divider" style="display:flex;align-items:center;gap:12px;margin:18px 0;color:#66706a;font-size:13px">
            <span style="flex:1;height:1px;background:#e3e8e5"></span>
            or
            <span style="flex:1;height:1px;background:#e3e8e5"></span>
        </div>

        <div style="margin-bottom:10px">
            <label style="font-size:13px;font-weight:600;color:#66706a">Continue as</label>
            <select id="googleRole" style="width:100%;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid #e3e8e5">
                <option value="tenant">Tenant / Buyer</option>
                <option value="owner">Owner / Landlord</option>
            </select>
        </div>

        <button type="button" id="googleLoginBtn" class="secondary-btn" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-radius:12px;border:1px solid #e3e8e5;background:#fff;font-weight:700;cursor:pointer">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" width="18" height="18" onerror="this.style.display='none'">
            Continue with Google
        </button>

        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase-client.js"></script>
<script src="JS/leaseaccom-live-mode.js"></script>
<script src="JS/leaseaccom-cloud.js"></script>
<script src="JS/role-walls.js"></script>
<script src="JS/role-nav.js"></script>
<script src="JS/leaseaccom-data.js"></script>
<script src="JS/data.js"></script>
<script src="JS/config.js"></script>
<script src="JS/api-client.js"></script>
<script src="JS/app.js"></script>

<script src="JS/leaseaccom-polish.js"></script>

<footer class="site-footer leaseaccom-standard-footer"><div class="footer-bottom"><span>© 2026 LeaseAccom. All rights reserved.</span><span>Built for Nigeria</span></div></footer>

<script>
(function () {
  var btn = document.getElementById("googleLoginBtn");
  if (!btn) return;
  btn.addEventListener("click", async function () {
    var status = document.getElementById("authStatus");
    var role = (document.getElementById("googleRole") || {}).value || "tenant";
    function show(m, ok) {
      if (!status) return;
      status.textContent = m;
      status.className = "form-status is-visible " + (ok ? "is-success" : "is-error");
    }
    show("Redirecting to Google…", true);
    try {
      if (!window.LeaseAccomAuth || !window.LeaseAccomAuth.signInWithGoogle) {
        return show("Google sign-in is not available. Check Supabase client.");
      }
      var result = await window.LeaseAccomAuth.signInWithGoogle(role);
      if (result && result.error) show(result.error.message || "Google sign-in failed");
    } catch (err) {
      show(err.message || "Google sign-in failed");
    }
  });
})();
</script>

</body>

</html>
