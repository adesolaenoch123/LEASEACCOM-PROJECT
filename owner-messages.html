<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{document.documentElement.classList.add("lh-preload-lock")}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage tenant conversations and property enquiries on LeaseAccom.">
  <title>Messages — LeaseAccom</title>
  <link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
  <link rel="stylesheet" href="CSS/style.css">
  <link rel="stylesheet" href="CSS/owner-messages.css?v=message-logo-search-v2">
</head>
<body class="owner-messages-page" data-leaseaccom-page="owner-messages">
  <header class="om-header">
    <a class="om-brand" href="owner-dashboard.html" aria-label="LeaseAccom dashboard">
      <img src="IMAGES/leaseaccom-messages-logo.png" alt="LeaseAccom">
    </a>
    <label class="om-search">
      <i class="bx bx-search" aria-hidden="true"></i>
      <input id="conversationSearch" type="search" placeholder="Search messages..." autocomplete="off" aria-label="Search messages">
    </label>
    <div class="om-header-actions">
      <button class="om-icon-button" id="openProfileBtn" type="button" aria-label="Open profile">
        <img id="topProfileAvatar" src="" alt="">
      </button>
      <div class="om-profile-name"><strong id="topProfileName">Property Owner</strong><span>Landlord</span></div>
      <button class="om-icon-button om-more-button" type="button" aria-label="More options" title="More options"><i class="bx bx-dots-vertical-rounded" aria-hidden="true"></i></button>
    </div>
  </header>

  <main class="om-main">
    <section class="om-inbox" aria-label="Inbox">
      <div class="om-inbox-heading">
        <div>
          <span class="om-eyebrow">YOUR INBOX</span>
          <h1>Messages</h1>
        </div>
        <button class="om-icon-button om-compose" type="button" aria-label="New message" title="New message"><i class="bx bx-edit-alt" aria-hidden="true"></i></button>
      </div>
      <nav class="om-filters" aria-label="Message categories">
        <button class="message-filter active" type="button" data-filter="all">All</button>
        <button class="message-filter" type="button" data-filter="chats">Chats</button>
        <button class="message-filter" type="button" data-filter="updates">Property updates</button>
        <button class="message-filter" type="button" data-filter="notifications">Notifications</button>
      </nav>
      <div id="ownerConversationList" class="conversation-list" aria-live="polite"></div>
      <div id="ownerNoConversations" class="om-empty-list">
        <span class="om-empty-icon"><i class="bx bx-message-rounded-dots" aria-hidden="true"></i></span>
        <strong>No conversations yet</strong>
        <p>Tenant conversations and property updates will appear here.</p>
      </div>
    </section>

    <section class="om-chat" aria-label="Conversation">
      <div id="ownerChatEmpty" class="om-chat-empty">
        <span class="om-empty-icon"><i class="bx bx-message-rounded-dots" aria-hidden="true"></i></span>
        <h2>Your conversations</h2>
        <p>Choose a conversation to start messaging.</p>
      </div>
      <div id="ownerChatContent" class="chat-content" style="display:none">
        <header class="om-chat-header">
          <button class="om-icon-button om-back" id="chatBackBtn" type="button" aria-label="Back to messages"><i class="bx bx-arrow-back" aria-hidden="true"></i></button>
          <button class="om-contact" id="chatOwnerProfileBtn" type="button" aria-label="View tenant profile">
            <img id="tenantChatOwnerAvatar" src="" alt="">
            <span class="om-contact-info">
              <strong id="chatPersonName">Tenant</strong>
              <span class="om-contact-status"><i aria-hidden="true"></i> Active now</span>
              <small id="chatPropertyName">Property enquiry</small>
            </span>
          </button>
          <div class="om-chat-actions">
            <button class="om-icon-button" id="ownerChatCallBtn" type="button" aria-label="Call tenant" title="Call"><i class="bx bx-phone" aria-hidden="true"></i></button>
            <button class="om-icon-button" id="ownerChatVideoBtn" type="button" aria-label="Video call" title="Video call"><i class="bx bx-video" aria-hidden="true"></i></button>
            <button class="om-icon-button om-chat-more" type="button" aria-label="More chat options" title="More"><i class="bx bx-dots-vertical-rounded" aria-hidden="true"></i></button>
          </div>
        </header>
        <div class="om-chat-protection"><i class="bx bx-lock-alt" aria-hidden="true"></i> Your messages are private and secure</div>
        <div class="om-thread">
          <div class="om-date-divider"><span>Today</span></div>
          <article id="ownerChatPropertyCard" class="om-property-card" hidden></article>
          <div id="ownerChatMessages" class="chat-messages" aria-live="polite"></div>
        </div>
        <form id="ownerMessageForm" class="om-composer">
          <button class="om-composer-tool" id="ownerEmojiBtn" type="button" aria-label="Add emoji" title="Add emoji"><i class="bx bx-smile" aria-hidden="true"></i></button>
          <button class="om-composer-tool om-attach" id="ownerAttachBtn" type="button" aria-label="Attach a file" title="Attach a file"><i class="bx bx-paperclip" aria-hidden="true"></i></button>
          <input id="ownerAttachmentInput" type="file" hidden>
          <input id="ownerMessageInput" class="message-input" type="text" placeholder="Type a message..." autocomplete="off" aria-label="Type a message" required>
          <button class="om-composer-tool om-camera" id="ownerCameraBtn" type="button" aria-label="Add a photo" title="Add a photo"><i class="bx bx-camera" aria-hidden="true"></i></button>
          <button class="om-composer-tool om-mic" id="ownerMicBtn" type="button" aria-label="Record a voice message" title="Voice message"><i class="bx bx-microphone" aria-hidden="true"></i></button>
          <button class="om-send-button" type="submit" aria-label="Send message" title="Send"><i class="bx bx-send" aria-hidden="true"></i></button>
        </form>
      </div>
    </section>
  </main>

  <aside id="profileDrawer" class="om-profile-drawer" aria-label="Your profile">
    <div class="om-drawer-heading">
      <h2>Your profile</h2>
      <button id="closeProfileBtn" class="om-icon-button" type="button" aria-label="Close profile"><i class="bx bx-x" aria-hidden="true"></i></button>
    </div>
    <div class="om-profile-picture">
      <img id="profilePreview" src="" alt="Profile picture">
      <label for="profilePictureInput" title="Change photo"><i class="bx bx-camera" aria-hidden="true"></i></label>
      <input type="file" id="profilePictureInput" accept="image/*" hidden>
    </div>
    <label class="om-profile-field" for="ownerDisplayName">Display name<input id="ownerDisplayName" type="text" placeholder="Enter your name"></label>
    <label class="om-profile-field" for="ownerAccountType">Account type<select id="ownerAccountType"><option value="owner">Property Owner</option><option value="agent">Property Manager</option></select></label>
    <label class="om-profile-field" for="ownerBio">Bio<textarea id="ownerBio" placeholder="Tell tenants a little about yourself..."></textarea></label>
    <button id="saveProfileBtn" class="om-save-profile" type="button">Save profile</button>
    <p id="profileMessage" class="om-profile-message">Profile saved successfully.</p>
  </aside>
  <button class="om-drawer-backdrop" id="profileBackdrop" type="button" aria-label="Close profile"></button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="JS/supabase-client.js"></script>
  <script src="JS/leaseaccom-live-mode.js"></script>
  <script src="JS/leaseaccom-cloud.js"></script>
  <script src="JS/config.js"></script>
  <script src="JS/api-client.js"></script>
  <script src="JS/messages-api.js"></script>
  <script src="JS/data.js"></script>
  <script src="JS/app.js"></script>
  <script src="JS/owner-messages.js"></script>
  <script src="JS/leaseaccom-polish.js"></script>
  <script src="JS/owner-mobile-nav.js"></script>
  <script src="JS/owner-messages-ui.js"></script>
</body>
</html>
