<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — LeaseHub</title>
<meta name="description" content="Log in to LeaseHub to manage your property search, applications and messages.">

    <link rel="stylesheet" href="CSS/style.css">

<link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
</head>


<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <img src="IMAGES/Lease Hub logo.png" alt="Lease Hub">
    </a>

    <a href="properties.html" class="back-link">
        Browse properties
    </a>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-heading">

            <span class="section-label">
                WELCOME BACK
            </span>

            <h1>
                Log in to LeaseHub.
            </h1>

            <p>
                Access your properties, applications,
                viewings and messages.
            </p>

        </div>


        <form id="loginForm" class="auth-form">

            <label>

                Email address

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >

            </label>


            <label>

                Password

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Your password"
                    required
                >

            </label>


            <button
                type="submit"
                class="primary-btn auth-submit"
            >
                Log In
            </button>

        </form>

        <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>


        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase-client.js"></script>
<script src="JS/leasehub-data.js"></script>
<script src="JS/data.js"></script>
<script src="JS/config.js"></script>
<script src="JS/api-client.js"></script>
<script src="JS/app.js"></script>

<script src="JS/leasehub-polish.js"></script>

<footer class="site-footer leasehub-standard-footer"><div class="footer-bottom"><span>© 2026 LeaseHub. All rights reserved.</span><span>Built for Nigeria</span></div></footer>
</body>

</html>
