<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account — LeaseAccom</title>
<meta name="description" content="Create a LeaseAccom account to find properties or list a property for tenants.">

    <link rel="stylesheet" href="CSS/style.css">
<link rel="stylesheet" href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <img src="IMAGES/leaseaccom-logo-horizontal.svg" alt="LeaseAccom">
    </a>

</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-heading">

            <span class="section-label">
                JOIN LEASEACCOM
            </span>

            <h1>
                Create your account.
            </h1>

            <p>
                Find a home or list your property without
                the unnecessary stress.
            </p>

        </div>


        <form id="registerForm" class="auth-form">

            <label>
                I am a...

                <select id="accountType" required>

                    <option value="">
                        Select account type
                    </option>

                    <option value="tenant">
                        <i class="bx bx-building-house" aria-hidden="true"></i> Tenant / Property Seeker
                    </option>

                    <option value="owner">
                        🏢 Property Owner / Business
                    </option>

                </select>

            </label>


            <label>
                Full name

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >

            </label>


            <label>
                Email address

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

            </label>


            <label>
                Phone number

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="08012345678"
                    required
                >

            </label>


            <label>
                Password

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </label>


            <label class="checkbox-label">

                <input
                    type="checkbox"
                    id="agreeTerms"
                    required
                >

                <span>
                    I agree to the LeaseAccom terms and
                    privacy policy.
                </span>

            </label>


            <button
                type="submit"
                class="primary-btn auth-submit"
            >
                Create Account
            </button>

        </form>

        <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>


        
        <div class="auth-divider" style="display:flex;align-items:center;gap:12px;margin:18px 0;color:#66706a;font-size:13px">
            <span style="flex:1;height:1px;background:#e3e8e5"></span>or<span style="flex:1;height:1px;background:#e3e8e5"></span>
        </div>
        <button type="button" id="googleRegisterBtn" class="secondary-btn" style="width:100%;padding:12px;border-radius:12px;border:1px solid #e3e8e5;background:#fff;font-weight:700;cursor:pointer;margin-bottom:12px">
            Sign up with Google
        </button>
        <div class="auth-footer">

            Already have an account?

            <a href="login.html">
                Log in
            </a>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase-client.js"></script>
<script src="JS/platform-flags.js"></script>
<script src="JS/leaseaccom-live-mode.js"></script>
<script src="JS/leaseaccom-cloud.js"></script>
<script src="JS/role-walls.js"></script>
<script src="JS/role-nav.js"></script>
<script src="JS/leaseaccom-data.js"></script>
<script src="JS/data.js"></script>
<script src="JS/app.js"></script>

<script src="JS/leaseaccom-polish.js"></script>

<footer class="site-footer leaseaccom-standard-footer"><div class="footer-bottom"><span>© 2026 LeaseAccom. All rights reserved.</span><span>Built for Nigeria</span></div></footer>

<script>
(function () {
  var btn = document.getElementById("googleRegisterBtn");
  if (!btn) return;
  btn.addEventListener("click", async function () {
    var roleEl = document.getElementById("accountType");
    var role = roleEl ? roleEl.value : "tenant";
    var status = document.getElementById("authStatus");
    if (status) { status.textContent = "Redirecting to Google…"; status.className = "form-status is-visible"; }
    try {
      var result = await window.LeaseAccomAuth.signInWithGoogle(role);
      if (result && result.error && status) status.textContent = result.error.message;
    } catch (e) {
      if (status) status.textContent = e.message || "Failed";
    }
  });
})();
</script>
</body>

</ht
