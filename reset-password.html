<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set new password — LeaseAccom</title>
  <link rel="stylesheet" href="CSS/style.css">
  <style>
    .form-status.is-visible { display: block; margin-top: 12px; font-weight: 600; }
    .form-status.is-success { color: #0d7547; }
    .form-status.is-error { color: #c0392b; }
  </style>
</head>
<body>
<header class="navbar">
  <a href="index.html" class="logo">
    <img src="IMAGES/leaseaccom-logo-full.png" alt="LeaseAccom">
  </a>
</header>
<main class="auth-page">
  <div class="auth-container">
    <div class="auth-heading">
      <span class="section-label">NEW PASSWORD</span>
      <h1>Choose a new password</h1>
      <p>Use at least 8 characters. You’ll use this to log in next time.</p>
    </div>
    <form id="resetForm" class="auth-form">
      <label>
        New password
        <input type="password" id="newPassword" minlength="8" required autocomplete="new-password" placeholder="Min. 8 characters">
      </label>
      <label>
        Confirm password
        <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password" placeholder="Repeat password">
      </label>
      <button type="submit" class="primary-btn auth-submit">Save password</button>
    </form>
    <p class="auth-extra" style="margin-top:16px;">
      <a href="login.html">← Back to login</a>
    </p>
    <p id="authStatus" class="form-status" role="status" aria-live="polite"></p>
    <div class="auth-footer"><a href="login.html">Back to log in</a></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="JS/supabase-client.js"></script>
<script>
(function () {
  var form = document.getElementById("resetForm");
  var status = document.getElementById("authStatus");
  function show(msg, type) {
    status.textContent = msg;
    status.className = "form-status is-visible is-" + (type || "error");
  }
  // Supabase puts tokens in the URL hash after recovery redirect
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var a = document.getElementById("newPassword").value;
    var b = document.getElementById("confirmPassword").value;
    if (a.length < 8) return show("Password must be at least 8 characters.");
    if (a !== b) return show("Passwords do not match.");
    show("Saving…", "success");
    try {
      var result = await window.LeaseAccomAuth.updatePassword(a);
      if (result && result.error) return show(result.error.message || "Could not update password");
      show("Password updated. You can log in now.", "success");
      setTimeout(function () { location.href = "login.html"; }, 1200);
    } catch (err) {
      show(err.message || "Failed. Open the link from your email again.");
    }
  });
})();
</script>
</body>
</html>
